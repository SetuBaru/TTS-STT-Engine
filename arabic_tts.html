<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SilkyVoice – Text to Speech (Arabic & English)</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: "Segoe UI", "Noto Sans Arabic", system-ui, sans-serif;
      margin: 0;
      padding: 2rem;
      background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
      color: #e2e8f0;
      min-height: 100vh;
    }
    .container {
      max-width: 640px;
      margin: 0 auto;
      background: #1e293b;
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      border: 1px solid #334155;
    }
    h1 {
      margin-top: 0;
      margin-bottom: 0.5rem;
      font-size: 1.75rem;
      color: #fcd34d;
      font-weight: 700;
    }
    .subtitle {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
    }
    label {
      display: block;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
    }
    select {
      padding: 0.5rem 0.75rem;
      border-radius: 0.5rem;
      border: 1px solid #475569;
      background: #0f172a;
      color: #e2e8f0;
      font-size: 0.95rem;
      margin-right: 0.75rem;
    }
    textarea {
      width: 100%;
      min-height: 120px;
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      border: 1px solid #475569;
      background: #0f172a;
      color: #e2e8f0;
      font-size: 1.1rem;
      font-family: inherit;
      resize: vertical;
      direction: auto;
    }
    textarea::placeholder {
      color: #64748b;
    }
    textarea:focus {
      outline: none;
      border-color: #fcd34d;
      box-shadow: 0 0 0 3px rgba(252, 211, 77, 0.2);
    }
    .actions {
      margin-top: 1rem;
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    button {
      background: linear-gradient(180deg, #f59e0b 0%, #d97706 100%);
      color: #0f172a;
      border: none;
      padding: 0.65rem 1.25rem;
      border-radius: 0.5rem;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      transition: transform 0.1s, box-shadow 0.2s;
    }
    button:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.4);
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .secondary {
      background: #334155;
      color: #e2e8f0;
    }
    .secondary:hover:not(:disabled) {
      box-shadow: 0 4px 12px rgba(51, 65, 85, 0.5);
    }
    #status {
      margin-top: 1rem;
      font-size: 0.9rem;
      color: #94a3b8;
    }
    #status.error {
      color: #f87171;
    }
    #status.success {
      color: #34d399;
    }
    .audio-section {
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid #334155;
    }
    .audio-section h2 {
      font-size: 1rem;
      color: #cbd5e1;
      margin: 0 0 0.75rem 0;
      font-weight: 600;
    }
    audio {
      width: 100%;
      height: 48px;
      margin-top: 0.5rem;
    }
    audio::-webkit-media-controls-panel {
      background: #0f172a;
    }
    .back-link {
      display: inline-block;
      margin-bottom: 1rem;
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.9rem;
    }
    .back-link:hover {
      color: #fcd34d;
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="/" class="back-link">← Back to Transcription</a>
    <h1>Text to Speech</h1>
    <p class="subtitle">Enter text in <strong>Arabic or English</strong> and generate speech using Coqui XTTS-v2. Choose language or use Auto to detect from text. API: <code style="color:#94a3b8;">http://127.0.0.1:8000</code> · Page: <code style="color:#94a3b8;">/tts</code></p>

    <label for="languageSelect">Language</label>
    <select id="languageSelect" aria-label="Language">
      <option value="auto">Auto (detect from text)</option>
      <option value="ar">Arabic</option>
      <option value="en">English</option>
    </select>

    <label for="textInput">Text</label>
    <textarea
      id="textInput"
      placeholder="Enter Arabic or English — e.g. Hello world or مرحبا، كيف حالك؟"
      autofocus
    ></textarea>

    <div class="actions">
      <button id="generateBtn">Generate audio</button>
      <button id="playBtn" class="secondary" disabled>Play</button>
    </div>

    <div id="status"></div>

    <div class="audio-section">
      <h2>Output</h2>
      <audio id="audioPlayer" controls></audio>
    </div>
  </div>

  <script>
    // Use same origin when served from API; fallback when opened as file or origin invalid
    const API_BASE = (window.location.origin && (window.location.protocol === "http:" || window.location.protocol === "https:"))
      ? window.location.origin
      : "http://127.0.0.1:8000";
    const textInput = document.getElementById("textInput");
    const languageSelect = document.getElementById("languageSelect");
    const generateBtn = document.getElementById("generateBtn");
    const playBtn = document.getElementById("playBtn");
    const statusEl = document.getElementById("status");
    const audioPlayer = document.getElementById("audioPlayer");

    function setStatus(msg, type) {
      statusEl.textContent = msg;
      statusEl.className = type || "";
    }

    generateBtn.addEventListener("click", async () => {
      const text = textInput.value.trim();
      if (!text) {
        setStatus("Please enter some text (Arabic or English).", "error");
        return;
      }

      const language = languageSelect.value || "auto";

      generateBtn.disabled = true;
      setStatus("Generating audio…");
      playBtn.disabled = true;
      audioPlayer.removeAttribute("src");

      try {
        const response = await fetch(API_BASE + "/tts", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: text, language: language }),
        });

        if (!response.ok) {
          const err = await response.json().catch(() => ({ detail: response.statusText }));
          throw new Error(err.detail || "Request failed");
        }

        const blob = await response.blob();
        const url = URL.createObjectURL(blob);
        audioPlayer.src = url;
        playBtn.disabled = false;
        setStatus("Ready. Use the player below or click Play.", "success");
      } catch (err) {
        const hint = err.message.includes("fetch") || err.message.includes("NetworkError")
          ? " Make sure the API is running: uvicorn api:app --port 8000"
          : "";
        setStatus("Error: " + err.message + hint, "error");
      } finally {
        generateBtn.disabled = false;
      }
    });

    playBtn.addEventListener("click", () => {
      if (audioPlayer.src) {
        audioPlayer.currentTime = 0;
        audioPlayer.play();
      }
    });
  </script>
</body>
</html>
